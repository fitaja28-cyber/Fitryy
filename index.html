"6\"\n              class=\"w-full border rounded px-3 py-2 @error('body') border-red-500 @enderror\">{{ old('body', $post->body ?? '') }}<\/textarea>\n    @error('body')\n        <p class=\"text-sm text-red-600 mt-1\">{{ $message }}<\/p>\n    @enderror\n<\/div>\n\n<div class=\"mb-4\">\n    <label for=\"image\" class=\"block text-sm font-medium mb-1\">Gambar (opsional, maks 2 MB)<\/label>\n    @if (isset($post) && $post->image)\n        <img src=\"{{ asset('storage/'.$post->image) }}\" alt=\"Gambar saat ini\" class=\"h-24 rounded mb-2\">\n    @endif\n    <input id=\"image\" type=\"file\" name=\"image\" accept=\"image/*\"\n           class=\"block text-sm @error('image') text-red-600 @enderror\">\n    @error('image')\n        <p class=\"text-sm text-red-600 mt-1\">{{ $message }}<\/p>\n    @enderror\n<\/div>\n\n<button class=\"bg-slate-900 text-white rounded px-4 py-2 text-sm\">Simpan<\/button>\n<a href=\"{{ route('posts.index') }}\" class=\"ml-3 text-sm underline\">Batal<\/a>\n"}, {"path": "resources/views/posts/create.blade.php", "code": "@extends('layouts.app')\n@section('title', 'Tulis Artikel')\n\n@section('content')\n    <h1 class=\"text-xl font-bold mb-4\">Tulis artikel<\/h1>\n    <form method=\"POST\" action=\"{{ route('posts.store') }}\" enctype=\"multipart/form-data\">\n        @csrf\n        @include('posts._form')\n    <\/form>\n@endsection\n"}, {"path": "resources/views/posts/edit.blade.php", "code": "@extends('layouts.app')\n@section('title', 'Edit Artikel')\n\n@section('content')\n    <h1 class=\"text-xl font-bold mb-4\">Edit artikel<\/h1>\n    <form method=\"POST\" action=\"{{ route('posts.update', $post) }}\" enctype=\"multipart/form-data\">\n        @csrf\n        @method('PUT')\n        @include('posts._form')\n    <\/form>\n@endsection\n"}, {"path": "resources/views/posts/show.blade.php", "code": "@extends('layouts.app')\n@section('title', $post->title)\n\n@section('content')\n    <article class=\"bg-white border rounded-lg p-6\">\n        @if ($post->image)\n            <img src=\"{{ asset('storage/'.$post->image) }}\" alt=\"Gambar {{ $post->title }}\"\n                 class=\"w-full max-h-80 object-cover rounded mb-4\">\n        @endif\n        <h1 class=\"text-2xl font-bold\">{{ $post->title }}<\/h1>\n        <p class=\"text-sm text-slate-500 mb-4\">\n            {{ $post->author }} &middot; {{ $post->created_at->translatedFormat('d F Y') }}\n        <\/p>\n        <div class=\"whitespace-pre-line\">{{ $post->body }}<\/div>\n    <\/article>\n    <a href=\"{{ route('posts.index') }}\" class=\"inline-block mt-4 text-sm underline\">&larr; Kembali<\/a>\n@endsection\n"}, {"path": "README.md", "code": "# TugasWeb-P10-BlogCRUD\n\nBlog sederhana dengan CRUD lengkap: resource route, resource controller, Blade layout + component,\nvalidasi, flash message, CSRF, Route Model Binding, dan pagination.\n\n## Menjalankan\n1. composer create-project laravel/laravel tugasweb-p10 && cd tugasweb-p10\n2. Buat database `tugasweb_p10`, atur DB_* di .env\n3. php artisan make:model Post -m        (lalu isi migration dan model dari repo ini)\n4. php artisan make:controller PostController --resource\n5. php artisan make:seeder PostSeeder\n6. Di DatabaseSeeder::run() tambahkan:  $this->call(PostSeeder::class);\n7. php artisan migrate --seed\n8. php artisan storage:link        (wajib agar gambar upload bisa tampil)\n9. php artisan serve  ->  http://127.0.0.1:8000\n\n## Pemetaan requirement\n| # | Requirement                         | Lokasi                                      |\n|---|-------------------------------------|---------------------------------------------|\n| 1 | Route::resource + named routes      | routes/web.php (posts.*)                    |\n| 2 | PostController 7 method             | app/Http/Controllers/PostController.php     |\n| 3 | Layout master @extends/@yield       | layouts/app.blade.php                       |\n| 4 | Component Alert dan Card            | resources/views/components/                 |\n| 5 | Validasi, error per field, old input| PostController::rules(), posts/_form        |\n| 6 | Flash message sukses/gagal          | with('success'/'error') + <x-alert>         |\n| 7 | @csrf + @method PUT/DELETE          | create, edit, components/card               |\n| 8 | Route Model Binding + pagination    | show/edit/update/destroy, paginate(6)       |\n\n## Route (php artisan route:list)\nGET     /posts                posts.index\nGET     /posts/create         posts.create\nPOST    /posts                posts.store\nGET     /posts/{post}         posts.show\nGET     /posts/{post}/edit    posts.edit\nPUT     /posts/{post}         posts.update\nDELETE  /posts/{post}         posts.destroy\n\n## Bonus\n- Pencarian judul (?q=) yang tetap terbawa saat pindah halaman (withQueryString)\n- Soft delete (kolom deleted_at, trait SoftDeletes)\n- Upload gambar (jpg/png/webp, maks 2 MB): disimpan di storage/app/public/posts, gambar lama otomatis dihapus saat diganti\n"}], "readme": "# TugasWeb-P10-BlogCRUD\n\nBlog sederhana dengan CRUD lengkap: resource route, resource controller, Blade layout + component,\nvalidasi, flash message, CSRF, Route Model Binding, dan pagination.\n\n## Menjalankan\n1. composer create-project laravel/laravel tugasweb-p10 && cd tugasweb-p10\n2. Buat database `tugasweb_p10`, atur DB_* di .env\n3. php artisan make:model Post -m        (lalu isi migration dan model dari repo ini)\n4. php artisan make:controller PostController --resource\n5. php artisan make:seeder PostSeeder\n6. Di DatabaseSeeder::run() tambahkan:  $this->call(PostSeeder::class);\n7. php artisan migrate --seed\n8. php artisan storage:link        (wajib agar gambar upload bisa tampil)\n9. php artisan serve  ->  http://127.0.0.1:8000\n\n## Pemetaan requirement\n| # | Requirement                         | Lokasi                                      |\n|---|-------------------------------------|---------------------------------------------|\n| 1 | Route::resource + named routes      | routes/web.php (posts.*)                    |\n| 2 | PostController 7 method             | app/Http/Controllers/PostController.php     |\n| 3 | Layout master @extends/@yield       | layouts/app.blade.php                       |\n| 4 | Component Alert dan Card            | resources/views/components/                 |\n| 5 | Validasi, error per field, old input| PostController::rules(), posts/_form        |\n| 6 | Flash message sukses/gagal          | with('success'/'error') + <x-alert>         |\n| 7 | @csrf + @method PUT/DELETE          | create, edit, components/card               |\n| 8 | Route Model Binding + pagination    | show/edit/update/destroy, paginate(6)       |\n\n## Route (php artisan route:list)\nGET     /posts                posts.index\nGET     /posts/create         posts.create\nPOST    /posts                posts.store\nGET     /posts/{post}         posts.show\nGET     /posts/{post}/edit    posts.edit\nPUT     /posts/{post}         posts.update\nDELETE  /posts/{post}         posts.destroy\n\n## Bonus\n- Pencarian judul (?q=) yang tetap terbawa saat pindah halaman (withQueryString)\n- Soft delete (kolom deleted_at, trait SoftDeletes)\n- Upload gambar (jpg/png/webp, maks 2 MB): disimpan di storage/app/public/posts, gambar lama otomatis dihapus saat diganti\n", "demoHtml": "\n<div class=\"browser\">\n <div class=\"bar\"><span>127.0.0.1:8000<\/span><span id=\"path\" style=\"flex:1\">/posts<\/span><span>Tugas 10 · simulasi<\/span><\/div>\n <div class=\"pg\" id=\"app\" style=\"min-height:360px\"><\/div>\n<\/div>\n<p class=\"lead\" style=\"margin-top:10px;font-size:.9rem\">Simulasi interaktif alur CRUD: coba kirim form kosong, unggah gambar (jpg/png/webp, maks 2 MB) untuk melihat error per field, lalu edit, hapus, cari, dan pindah halaman. Data hanya hidup di halaman ini.<\/p>\n", "demoJs": "\nvar app=document.getElementById('app'),pathEl=document.getElementById('path');\nvar posts=['Mengenal Routing di Laravel','Blade: Layout dan Component','Validasi Form dengan Aman','Memahami CSRF Token','Route Model Binding Praktis','Resource Controller Itu Hemat','Flash Message untuk Umpan Balik','Pagination dalam Tiga Baris'].map(function(t,i){return{id:i+1,title:t,author:'Fitry Meriyana Halawa',body:'Artikel contoh nomor '+(i+1)+'. Isinya cukup panjang agar lolos validasi minimal 20 karakter.',img:null}});\nvar nid=9,q='',page=1,view='index',cur=null,flash=null,errs={},old={},pend=null,PER=3;\nfunction validate(f){var r={};\n if(!f.title.trim())r.title='Judul wajib diisi.';else if(f.title.trim().length<5)r.title='Judul minimal 5 karakter.';else if(f.title.length>150)r.title='Judul maksimal 150 karakter.';\n if(!f.author.trim())r.author='Penulis wajib diisi.';\n if(!f.body.trim())r.body='Isi artikel wajib diisi.';else if(f.body.trim().length<20)r.body='Isi artikel minimal 20 karakter.';\n return r}\nfunction fl(){if(!flash)return'';var h='<div class=\"flash '+(flash[0]==='ok'?'ok':'er')+'\" role=\"alert\">'+esc(flash[1])+'<\/div>';flash=null;return h}\nfunction field(n,l,v,area){var c=errs[n]?' class=\"bad\"':'';var i=area?'<textarea id=\"f_'+n+'\" name=\"'+n+'\" rows=\"4\"'+c+'>'+esc(v)+'<\/textarea>':'<input id=\"f_'+n+'\" name=\"'+n+'\" value=\"'+esc(v)+'\"'+c+'>';\n return '<label for=\"f_'+n+'\">'+l+'<\/label>'+i+(errs[n]?'<div class=\"err\">'+esc(errs[n])+'<\/div>':'')}\nfunction thumb(src,h){return src?'<img src=\"'+src+'\" alt=\"Gambar artikel\" style=\"width:100%;height:'+h+'px;object-fit:cover;border-radius:6px\">':''}\nfunction form(p){var v=Object.keys(old).length?old:(p||{title:'',author:'Fitry Meriyana Halawa',body:''});var img=pend||(p&&p.img)||null;\n return '<h3>'+(p?'Edit artikel':'Tulis artikel')+'<\/h3><form id=\"fm\" novalidate><div style=\"font-size:12px;color:#64748B\">@csrf'+(p?' · @method(PUT)':'')+' · enctype=\"multipart/form-data\"<\/div>'+field('title','Judul',v.title)+field('author','Penulis',v.author)+field('body','Isi artikel',v.body,1)+\n '<label for=\"f_image\">Gambar (opsional, maks 2 MB)<\/label><input type=\"file\" id=\"f_image\" accept=\"image/*\"><div class=\"err\" id=\"imgerr\">'+esc(errs.image||'')+'<\/div><div id=\"imgprev\" style=\"max-width:220px\">'+thumb(img,110)+'<\/div>'+\n '<p><button class=\"btn\" type=\"submit\">Simpan<\/button> <button type=\"button\" class=\"lk\" data-a=\"home\">Batal<\/button><\/p><\/form>'}\nfunction render(){\n pathEl.textContent=view==='index'?'/posts'+(q?'?q='+encodeURIComponent(q):'')+(page>1?(q?'&':'?')+'page='+page:''):view==='create'?'/posts/create':view==='edit'?'/posts/'+cur.id+'/edit':'/posts/'+cur.id;\n var h=fl();\n if(view==='index'){\n  var list=posts.filter(function(p){return p.title.toLowerCase().indexOf(q.toLowerCase())>-1}).reverse();\n  var pages=Math.max(1,Math.ceil(list.length/PER));if(page>pages)page=pages;\n  var rows=list.slice((page-1)*PER,page*PER);\n  h+='<div style=\"display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap;margin-bottom:12px\"><form id=\"sf\" style=\"display:flex;gap:6px\"><input name=\"q\" value=\"'+esc(q)+'\" placeholder=\"Cari judul...\" aria-label=\"Cari judul\" style=\"width:170px\"><button class=\"btn sm\" style=\"background:#fff;color:#1E293B;border:1px solid #CBD5E1\">Cari<\/button><\/form><button class=\"btn\" data-a=\"new\">Tulis artikel<\/button><\/div>';\n  h+='<div class=\"grid2\">'+(rows.length?rows.map(function(p){return '<article class=\"cardx\">'+thumb(p.img,90)+'<a data-a=\"show\" data-id=\"'+p.id+'\">'+esc(p.title)+'<\/a><span style=\"font-size:13px;color:#475569\">'+esc(p.body.slice(0,80))+'…<\/span><small>'+esc(p.author)+'<\/small><span style=\"display:flex;gap:12px\"><button class=\"lk\" data-a=\"edit\" data-id=\"'+p.id+'\">Edit<\/button><button class=\"lk del\" data-a=\"del\" data-id=\"'+p.id+'\">Hapus<\/button><\/span><\/article>'}).join(''):'<p class=\"m\">Belum ada artikel'+(q?' untuk \"'+esc(q)+'\"':'')+'.<\/p>')+'<\/div>';\n  h+='<div class=\"pgn\">'+Array.apply(null,{length:pages}).map(function(_,i){return '<button data-a=\"pg\" data-id=\"'+(i+1)+'\"'+(i+1===page?' aria-current=\"true\"':'')+'>'+(i+1)+'<\/button>'}).join('')+'<\/div>';\n }else if(view==='create')h+=form();\n else if(view==='edit')h+=form(cur);\n else h+=thumb(cur.img,160)+'<h3>'+esc(cur.title)+'<\/h3><p class=\"m\">'+esc(cur.author)+'<\/p><p>'+esc(cur.body)+'<\/p><button class=\"lk\" data-a=\"home\">← Kembali<\/button>';\n app.innerHTML=h;\n var fm=document.getElementById('fm');\n if(fm){\n  var fi=document.getElementById('f_image');\n  fi.onchange=function(){var f=fi.files[0],er=document.getElementById('imgerr'),pv=document.getElementById('imgprev');if(!f)return;\n   if(!/^image\\/(jpeg|png|webp)$/.test(f.type)){errs.image='Berkas harus berupa gambar (jpg, jpeg, png, webp).';er.textContent=errs.image;pend=null;fi.value='';return}\n   if(f.size>2*1024*1024){errs.image='Ukuran gambar maksimal 2 MB.';er.textContent=errs.image;pend=null;fi.value='';return}\n   delete errs.image;er.textContent='';var r=new FileReader();r.onload=function(){pend=r.result;pv.innerHTML=thumb(pend,110)};r.readAsDataURL(f)};\n  fm.onsubmit=function(e){e.preventDefault();var f={title:fm.title.value,author:fm.author.value,body:fm.body.value},ie=errs.image;errs=validate(f);if(ie)errs.image=ie;\n   if(Object.keys(errs).length){old=f;render();return}\n   var img=pend||(view==='edit'?cur.img:null);old={};\n   if(view==='edit'){Object.assign(cur,f,{img:img});flash=['ok','Perubahan artikel disimpan.'];view='show'}else{posts.push({id:nid++,title:f.title,author:f.author,body:f.body,img:img});flash=['ok','Artikel berhasil dipublikasikan.'];view='index';page=1}\n   errs={};pend=null;render()}}\n var sf=document.getElementById('sf');if(sf)sf.onsubmit=function(e){e.preventDefault();q=sf.q.value;page=1;render()}}\napp.onclick=function(e){var b=e.target.closest('[data-a]');if(!b)return;var a=b.dataset.a,id=+b.dataset.id;\n var p=posts.filter(function(x){return x.id===id})[0];errs={};pend=null;\n if(a==='home'){view='index';old={}}\n else if(a==='new'){view='create';old={}}\n else if(a==='show'){view='show';cur=p}\n else if(a==='edit'){view='edit';cur=p;old={}}\n else if(a==='pg')page=id;\n else if(a==='del'){if(confirm('Hapus artikel ini?')){posts=posts.filter(function(x){return x.id!==id});flash=['ok','Artikel dipindahkan ke sampah.']}}\n render()};\nrender();\n"}</script>
<script>
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
(function(){
var D=JSON.parse(document.getElementById('data').textContent);
var V=document.getElementById('view'),T=document.getElementById('tabs');
var KEY='tr-'+D.id,st={};try{st=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){}}
var tab='ringkasan',cur=D.files[0].path,TABS=[['ringkasan','Ringkasan'],['kode','Kode proyek'],['readme','README'],['demo','Demo']];
function copy(text,btn){var done=function(){var o=btn.textContent;btn.textContent='Tersalin';setTimeout(function(){btn.textContent=o},1400)};
 if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(done,fb)}else fb();
 function fb(){var a=document.createElement('textarea');a.value=text;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){}a.remove()}}
function tabs(){T.innerHTML='';TABS.forEach(function(t){var b=document.createElement('button');b.textContent=t[1];b.setAttribute('role','tab');b.setAttribute('aria-selected',t[0]===tab);b.onclick=function(){tab=t[0];draw()};T.appendChild(b)})}
function ringkasan(){
 V.innerHTML='<p class="lead">'+esc(D.lead)+'</p><h2>Pemetaan requirement</h2><ul class="req">'+D.reqs.map(function(r){return '<li><div class="rq"><span><b>'+esc(r.t)+'</b><small>'+r.f.map(function(f){return '<button class="lnk" data-f="'+esc(f)+'">'+esc(f)+'</button>'}).join('')+'</small></span></div></li>'}).join('')+'</ul>'+
 '<h2>Bonus</h2><ul class="bul">'+D.bonus.map(function(x){return '<li>'+esc(x)+'</li>'}).join('')+'</ul>';
 V.querySelectorAll('.lnk').forEach(function(b){b.onclick=function(e){e.preventDefault();e.stopPropagation();cur=b.dataset.f;tab='kode';draw()}})}
function kode(){
 var f=D.files.filter(function(x){return x.path===cur})[0]||D.files[0];
 V.innerHTML='<div class="code-wrap"><div class="files" role="list"></div><div class="cbox"><div class="cbar"><span></span><button>Salin file</button></div><pre class="code"></pre></div></div>';
 var L=V.querySelector('.files');
 D.files.forEach(function(x){var b=document.createElement('button');b.textContent=x.path;b.setAttribute('aria-current',x.path===f.path);b.onclick=function(){cur=x.path;kode()};L.appendChild(b)});
 V.querySelector('.cbar span').textContent=f.path;V.querySelector('pre').textContent=f.code;
 V.querySelector('.cbar button').onclick=function(){copy(f.code,this)}}
function readme(){V.innerHTML='<div class="cbox"><div class="cbar"><span>README.md</span><button>Salin README</button></div><pre class="code" style="white-space:pre-wrap"></pre></div>';
 V.querySelector('pre').textContent=D.readme;V.querySelector('.cbar button').onclick=function(){copy(D.readme,this)}}
function demo(){V.innerHTML=D.demoHtml;try{new Function(D.demoJs)()}catch(e){V.insertAdjacentHTML('beforeend','<p class="note">Demo gagal dimuat: '+esc(e.message)+'</p>')}}
function draw(){tabs();({ringkasan:ringkasan,kode:kode,readme:readme,demo:demo})[tab]()}
draw();
})();
</script>
